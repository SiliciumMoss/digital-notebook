<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob: https:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self'; connect-src 'self' https:">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cozy Notebook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Dancing+Script:wght@600&family=Lora:ital,wght@0,400;0,600;1,400&family=Nunito:wght@400;600;800&family=Patrick+Hand&family=Permanent+Marker&family=Special+Elite&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body class="theme-cozy">
<div id="app">

  <!-- ===== Bookshelf ===== -->
  <section id="shelf-view" class="view">
    <header class="shelf-head">
      <div class="brand"><span class="brand-logo">📓</span><div><h1>Cozy Notebook</h1><p>Your notebooks, all in one place</p></div></div>
      <div class="shelf-actions">
        <button class="btn" id="shelf-search">🔍 Search</button>
        <button class="btn" id="shelf-import">⬆ Import</button>
        <button class="btn" id="shelf-settings">⚙ Settings</button>
      </div>
    </header>
    <div id="shelf" class="shelf"></div>
  </section>

  <!-- ===== Notebook ===== -->
  <section id="nb-view" class="view hidden">
    <header id="topbar">
      <button class="icon-btn" id="btn-shelf" title="Back to bookshelf">📚</button>
      <button class="icon-btn" id="btn-pages-toggle" title="Show / hide pages list">☰</button>
      <input id="nb-title" class="nb-title" spellcheck="false" title="Notebook name">
      <span class="save-state" data-state="saved">✓ Saved</span>
      <span class="spacer"></span>
      <button class="icon-btn" id="btn-undo" title="Undo (Ctrl+Z)">↶</button>
      <button class="icon-btn" id="btn-redo" title="Redo (Ctrl+Y)">↷</button>
      <span class="sep"></span>
      <button class="icon-btn" id="zoom-out" title="Zoom out">−</button>
      <button class="zoom-label" id="zoom-label" title="Fit to width">100%</button>
      <button class="icon-btn" id="zoom-in" title="Zoom in">+</button>
      <span class="sep"></span>
      <button class="icon-btn" id="btn-search" title="Search (Ctrl+K)">🔍</button>
      <button class="icon-btn" id="btn-export" title="Export, print & backup">⤓</button>
      <button class="icon-btn" id="btn-settings" title="Settings">⚙</button>
      <button class="icon-btn" id="btn-inspector" title="Show / hide properties">🎛</button>
    </header>

    <div id="fmtbar">
      <select id="fmt-font" title="Font"></select>
      <input id="fmt-size" type="number" min="8" max="160" value="20" title="Font size">
      <button class="fmt" data-cmd="bold" title="Bold (Ctrl+B)"><b>B</b></button>
      <button class="fmt" data-cmd="italic" title="Italic (Ctrl+I)"><i>I</i></button>
      <button class="fmt" data-cmd="underline" title="Underline (Ctrl+U)"><u>U</u></button>
      <button class="fmt" data-cmd="strikeThrough" title="Strikethrough"><s>S</s></button>
      <span class="sep"></span>
      <button class="fmt" id="fmt-color" title="Text colour"><span class="a">A</span><span class="bar" id="fmt-color-bar"></span></button>
      <button class="fmt" id="fmt-hilite" title="Highlight"><span class="a hl">ab</span><span class="bar" id="fmt-hilite-bar"></span></button>
      <span class="sep"></span>
      <button class="fmt" data-cmd="justifyLeft" title="Align left">⯇</button>
      <button class="fmt" data-cmd="justifyCenter" title="Centre">≡</button>
      <button class="fmt" data-cmd="justifyRight" title="Align right">⯈</button>
      <span class="sep"></span>
      <button class="fmt" data-cmd="insertUnorderedList" title="Bullet list">• ≡</button>
      <button class="fmt" data-cmd="insertOrderedList" title="Numbered list">1. ≡</button>
      <button class="fmt" data-cmd="checklist" title="Insert ☐ checkbox">☐</button>
      <button class="fmt" data-cmd="removeFormat" title="Clear formatting">⌫</button>
      <span class="fmt-hint" id="fmt-hint">Double-click a text box to edit it</span>
    </div>

    <div id="drawbar" class="hidden"></div>

    <div id="main">
      <nav id="toolbar" aria-label="Tools"></nav>
      <aside id="pages-panel"></aside>
      <div id="workspace">
        <div id="stage"><div id="sizer"><div id="book" class="book"></div></div></div>
      </div>
      <aside id="inspector"><div class="ins-head"><h2>Properties</h2></div><div id="inspector-body"></div></aside>
    </div>
  </section>
</div>

<script src="js/util.js"></script>
<script src="js/store.js"></script>
<script src="js/ink.js"></script>
<script src="js/items.js"></script>
<script src="js/editor.js"></script>
<script src="js/inspector.js"></script>
<script src="js/templates.js"></script>
<script src="js/ui.js"></script>
<script src="js/app.js"></script>
</body>
</html>
